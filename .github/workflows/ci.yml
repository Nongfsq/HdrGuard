name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore HdrGuard.sln

      - name: Test
        run: dotnet test .\tests\HdrGuard.Tests\HdrGuard.Tests.csproj --configuration Release --no-restore

      - name: Publish smoke
        run: dotnet publish .\src\HdrGuard\HdrGuard.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o .\artifacts\publish-smoke

      - name: Whitespace check
        shell: pwsh
        run: git diff --check
