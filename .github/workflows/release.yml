name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test .\tests\HdrGuard.Tests\HdrGuard.Tests.csproj --configuration Release

      - name: Package
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          .\scripts\package-release.ps1 -Version $version

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/HdrGuard-win-x64.zip
            artifacts/HdrGuard-win-x64.zip.sha256
          fail_on_unmatched_files: true
